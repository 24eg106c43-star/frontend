<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Farmer Direct Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="stylesheet" href="auth.css"></head>
<body>
<div class="auth-page">
  <form id="form" class="auth-card">
    <div class="logo">🌾</div>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="sub">Login to Farmer Direct Market</p>
    <div class="tabs"><button type="button" id="tLogin" class="on">Login</button><button type="button" id="tReg">Register</button></div>
    <div id="regOnly" hidden>
      <label>I am a</label>
      <select id="role"><option value="customer">Customer (buyer)</option><option value="farmer">Farmer (seller)</option></select>
      <label>Name</label><input id="name" placeholder="Your name">
      <label>Phone</label><input id="phone" placeholder="Phone number">
      <label id="locLabel">Address</label><input id="loc" placeholder="Address">
    </div>
    <label>Email</label><input id="email" type="email" placeholder="you@example.com" required>
    <label>Password</label><input id="password" type="password" placeholder="Enter your password" required>
    <p id="err" class="err"></p>
    <button id="submit" class="btn" type="submit">Login</button>
    <p class="demo">Demo: <b>customer@demo.com</b>, <b>farmer@demo.com</b> or <b>admin@demo.com</b> / <b>demo123</b></p>

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #e0e0e0;font-size:12px;text-align:center;">
      <details id="backendSettings">
        <summary style="cursor:pointer;color:#2e7d32;font-weight:600;">⚙️ Backend API Settings</summary>
        <div style="margin-top:8px;text-align:left;">
          <label style="font-size:11px;">Backend Render URL</label>
          <input id="backendUrlInput" placeholder="https://backend-xxxx.onrender.com" style="margin-bottom:6px;width:100%;box-sizing:border-box;padding:6px;border:1px solid #ccc;border-radius:4px;">
          <div style="display:flex;gap:6px;margin-top:4px;">
            <button type="button" id="testBackendUrlBtn" class="btn" style="flex:1;padding:7px;font-size:12px;background:#666;">🔍 Test</button>
            <button type="button" id="saveBackendUrlBtn" class="btn" style="flex:1;padding:7px;font-size:12px;background:#2e7d32;">💾 Save</button>
          </div>
          <div id="backendTestResult" style="margin-top:6px;font-size:11px;min-height:14px;"></div>
        </div>
      </details>
    </div>
  </form>
</div>
<script src="config.js"></script>
<script src="auth.js"></script>
</body></html>
